name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - name: Build (linux/amd64, linux/arm64, windows/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null .

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: notified:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name notified -p 8080:8080 notified:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          docker logs notified
          test -n "$ok"
          # First start must ask for setup and serve the web UI.
          curl -fsS http://127.0.0.1:8080/api/status | grep -q '"setup_required":true'
          curl -fsS http://127.0.0.1:8080/api/status | grep -q '"version":"0.0.0-ci"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'
      - name: Validate compose file
        run: docker compose config --quiet

  publish:
    name: Publish to GHCR
    needs: [go, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for git describe
      - name: Work out the version
        id: version
        run: echo "version=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # "latest" follows releases (added automatically for version tags);
          # "edge" follows main.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
