services:
  notified:
    image: ghcr.io/tet0r/notified:latest
    # To build from source instead, comment out the line above and use:
    # build: .
    container_name: notified
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    environment:
      - TZ=America/New_York
    volumes:
      # ALL of Notified's settings live here. "./data" means a folder next to
      # this file, so starting this file from a different place (or pasting it
      # into Portainer or another stack manager) silently starts with empty
      # settings. A full path is safer, for example:
      # - /srv/notified/data:/data
      - ./data:/data
      # The two mounts below give the container sight of the host, so they are
      # off by default. Uncomment only the ones you use.
      #
      # "Docker containers" integration. Read-only on the file, but access to
      # the Docker socket is effectively root on this host.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      #
      # "System monitor" disk usage. Prefer mounting just the disks you want
      # watched (and list those paths in the integration) over the whole host:
      # - /mnt/media:/mnt/media:ro
      # - /:/host:ro
